# Continuous integration: the checks README.md asks a contributor to run before
# pushing — frozen install, typecheck, both suites, production SPA build.
#
# The api suite is integration-heavy rather than hermetic: `tests/globalSetup.ts`
# refuses to run without TEST_DATABASE_URL and migrates that database, and four
# specs read the delivered mail back out of Mailpit's HTTP API. Both services are
# therefore started here on the exact ports the suite hard-codes (SMTP 1025,
# Mailpit API 8025).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # The suite migrates and truncates the database TEST_DATABASE_URL
          # names. It is a throwaway database, never the application one.
          MYSQL_DATABASE: newtonite_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025 # SMTP endpoint the mailer sends to
          - 8025:8025 # HTTP API the specs list messages from
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/newtonite_test
    steps:
      - uses: actions/checkout@v7
      # Bun is pinned in .bun-version, the same file the Dockerfiles mirror.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Build the SPA
        run: bun --cwd web run build

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newtonite Operations</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      ::selection {
        background-color: #ccfbf1;
        color: #0f766e;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        background-color: #f4f6f8;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      input, button, select, textarea {
        font-family: inherit;
      }
      input, textarea {
        caret-color: #0f766e;
      }
      input:focus, select:focus, textarea:focus {
        border-color: #0f766e !important;
        outline: 2px solid rgba(15, 118, 110, 0.25) !important;
        outline-offset: 0;
      }
      :focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 2px;
      }
      button {
        transition: transform 0.05s ease, background-color 0.15s ease, border-color 0.15s ease;
      }
      button:active:not(:disabled) {
        transform: scale(0.98);
      }
      button:disabled, input:disabled, select:disabled, textarea:disabled {
        cursor: not-allowed;
        opacity: 0.65;
      }
      a {
        color: #0f766e;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      table {
        font-variant-numeric: tabular-nums;
      }
      /* Rows/header share the grid container's column template via subgrid.
         Without subgrid they cannot, so container, header and rows each resolve
         one uniform template (--item-table-columns, no max-content tracks) and
         the rows' horizontal inset moves onto the container, which keeps every
         column inside the container box instead of painting past it.
         Every browser the build targets supports custom properties (Vite
         module target: chrome87/firefox78/safari14/edge88), so var() resolves
         here. */
      @supports not (grid-template-columns: subgrid) {
        .item-table {
          /* The container declares the primary template inline, so only an
             important declaration can replace it with the fallback. */
          grid-template-columns: var(--item-table-columns) !important;
          padding-inline: 1rem;
        }
        .item-table-header,
        .item-table-row {
          /* Header/rows declare `subgrid` inline; that value is unsupported
             here, so it is dropped and these plain declarations already win. */
          grid-template-columns: var(--item-table-columns);
          /* Their inline `padding: 0.875rem 1rem` is valid and only an
             important declaration can override it; the horizontal half moves
             to the container above so the columns stay inside the container
             box. */
          padding-inline: 0 !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

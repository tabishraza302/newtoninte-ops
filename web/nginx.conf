# Single-origin server for Newtonite Ops.
# Installed as /etc/nginx/conf.d/default.conf in the web image.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Built assets are content-hashed by Vite; cache them aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API surface: forward to the api service. Regex locations are evaluated
    # before the prefix `/` location below, so these win.
    location ~ ^/(auth|items|teams|invitations|admin|health|ready) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: unknown paths serve the app shell and let the router decide.
    location / {
        try_files $uri /index.html;
    }
}

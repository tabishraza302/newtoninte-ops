# Single-origin server for Newtonite Ops.
# Installed as /etc/nginx/conf.d/default.conf in the web image.

map "$request_method:$http_accept" $wants_html {
    default 0;
    "~*^(GET|HEAD):.*text/html" 1;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;
    # Resolve the Docker API service at request time so container restarts do not leave a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:3000;


    # Consistent API error envelope for oversized request bodies
    error_page 413 @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        return 413 '{"error":{"code":"VALIDATION_ERROR","message":"Payload too large"}}\n';
    }
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Gzip compression for static assets and text payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Built assets are content-hashed by Vite; cache them aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Dedicated monitoring endpoints: always reach the API regardless of Accept header.
    location ~ ^/(health|ready)$ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dedicated SSE endpoint: disable buffering and set long read timeout
    location = /notifications/stream {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # API surface vs SPA routes:
    # If browser document navigation requests HTML (GET/HEAD with Accept text/html),
    # restart location search to serve the SPA app shell (index.html via location /).
    # Otherwise (fetch / XHR / curl / mutation methods), forward to the API service.
    location ~ ^/(auth|items|teams|invitations|admin|notifications)(/.*)?$ {
        if ($wants_html) {
            rewrite ^ /index.html last;
        }
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache index.html so client updates land immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA fallback: unknown paths serve the app shell and let React router decide.
    location / {
        try_files $uri /index.html;
    }
}

# Newtonite Ops — single-origin dev stack.
#
#   docker compose up --build
#
# Web (:8080) serves the built SPA and reverse-proxies /auth /items /teams
# /invitations /admin /health /ready to the api service, so the browser only
# ever talks to one origin. MySQL (:3306), the API (:3000) and the Mailpit UI
# (:8025) are also published for local tooling.
#
# `api` and `worker` read `.env` (copy `.env.example`) and then pin the
# in-network endpoints — MySQL, Mailpit, and the web origin `:8080` for
# invite/reset links — because a `.env` written for host-run dev (`127.0.0.1`)
# cannot resolve from inside a container. The worker is its own service over the
# same image: without it every `email.*` job sits `pending` forever.
#
# NOTE: build contexts are the repository root (not ./api and ./web) because
# this is a Bun workspace: the single `bun.lock` and `tsconfig.base.json` live
# at the root, and `bun install --frozen-lockfile` needs them in the image.

services:
  mysql:
    image: mysql:8.0
    command: ["mysqld", "--innodb-buffer-pool-size=64M", "--max_connections=50"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: newtonite
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "--protocol=TCP", "-h", "127.0.0.1", "-uroot", "-proot", "-D", "newtonite", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI / HTTP API

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Migrate + idempotent seed before serving. The Dockerfile WORKDIR is
    # /app/api, so these scripts resolve to the api workspace.
    command: ["sh", "-c", "bun run db:migrate && bun run seed && bun run start"]
    env_file:
      - .env
    environment:
      # Invite / password-reset links must point at the web origin, not :5173.
      APP_BASE_URL: http://localhost:8080
      # The two endpoints on the compose network are pinned here because a
      # `.env` written for host-run dev (`127.0.0.1`) is unreachable from inside
      # a container — the same file is shared by both paths. A reader who wants
      # the `resend` driver edits this service, not `.env`.
      DATABASE_URL: mysql://root:root@mysql:3306/newtonite
      SMTP_URL: smtp://mailpit:1025
      MAIL_DRIVER: mailpit
    ports:
      - "127.0.0.1:3000:3000"
    # Both other services wait on this, so "healthy" also means the migrations
    # and the seed have already run. Exec form: no shell, so no quoting layer.
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy

  # Drains `outbox_jobs`. Without it every invitation, password-reset and
  # assignment email sits `pending` forever, which is exactly what the ops
  # screen would (correctly) report. Same image as `api`, different entry point.
  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sh", "-c", "bun run worker"]
    env_file:
      - .env
    environment:
      # Same reason as `api`: the compose network is not the host's loopback.
      DATABASE_URL: mysql://root:root@mysql:3306/newtonite
      SMTP_URL: smtp://mailpit:1025
      MAIL_DRIVER: mailpit
      # The worker is what renders invite/reset links, so it needs the web
      # origin too — otherwise the mail points at the dev server's :5173.
      APP_BASE_URL: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  mysql_data:
